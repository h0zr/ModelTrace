name: Deploy static ModelTrace to GitHub Pages

on:
  push:
    branches: [web-api-testing]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser API support
        run: node --test tests/*.test.mjs
      - name: Assemble browser test site
        run: |
          mkdir -p _site/data
          cp static/index.html static/styles.css static/repository-link.css static/pages.css static/pages-app.js static/api-client.js static/api-runner.js static/fingerprint-core.js static/challenge-browser.js static/.nojekyll _site/
          cp data/unified_bank.json _site/data/unified_bank.json
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
