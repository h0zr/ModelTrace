<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="在浏览器本地运行的语言模型指纹归因工具">
  <meta name="referrer" content="no-referrer">
  <title>ModelTrace</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./repository-link.css">
  <link rel="stylesheet" href="./pages.css">
</head>
<body>
  <header class="topbar">
    <div class="product-name"><span class="product-mark">MT</span><strong>ModelTrace</strong></div>
    <div class="topbar-actions">
      <div class="topbar-status"><span id="topbar-bank-count">正在加载指纹库</span></div>
      <a class="topbar-github" href="https://github.com/h0zr/ModelTrace" target="_blank" rel="noopener noreferrer" aria-label="在新标签页打开 ModelTrace 的 GitHub 仓库" title="GitHub 仓库">
        <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      </a>
    </div>
  </header>

  <main class="main-content static-main">
    <section class="workspace active">
      <div class="page-header">
        <h1>模型测试</h1>
        <div id="active-bank-badge" class="privacy-badge">本地计算</div>
      </div>

      <div class="mode-tabs" role="tablist" aria-label="测试方式">
        <button id="tab-manual" class="mode-tab" role="tab" aria-selected="false" aria-controls="test-manual" tabindex="-1" data-test-mode="manual" type="button">手动测试</button>
        <button id="tab-api" class="mode-tab active" role="tab" aria-selected="true" aria-controls="test-api" data-test-mode="api" type="button">API 自动测试</button>
      </div>

      <section id="test-manual" class="mode-panel" role="tabpanel" aria-labelledby="tab-manual" hidden>
        <div class="panel-toolbar">
          <strong>三次挑战</strong>
          <button id="regenerate" class="button secondary" type="button" disabled>重新生成</button>
        </div>
        <div id="challenge-list" class="challenge-list" aria-live="polite"></div>
        <div class="action-row"><button id="analyze" class="button primary" type="button" disabled>计算归因概率</button></div>
      </section>

      <section id="test-api" class="mode-panel active" role="tabpanel" aria-labelledby="tab-api">
        <form id="api-test-form" class="form-panel" autocomplete="off">
          <div class="form-grid two">
            <label for="test-api-base"><span>Base URL</span><input id="test-api-base" type="url" required placeholder="https://example.com/v1" spellcheck="false" autocapitalize="off"><small>可填写站点地址、API 基础路径或完整接口地址。</small></label>
            <label for="test-api-model"><span>接口模型名</span><input id="test-api-model" required placeholder="服务商提供的模型 ID" spellcheck="false" autocapitalize="off"></label>
            <label for="test-api-key"><span>API Key</span><input id="test-api-key" type="password" required autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="仅在当前页面使用"></label>
            <label for="test-api-format"><span>接口类型</span><select id="test-api-format"><option value="responses">Responses · /responses</option><option value="chat">Chat Completions · /chat/completions</option><option value="completions">Completions（旧版）· /completions</option></select></label>
            <label for="test-temperature"><span>温度（可选）</span><input id="test-temperature" type="number" min="0" max="2" step="any" placeholder="接口默认"></label>
            <label for="test-timeout"><span>单次超时（秒）</span><input id="test-timeout" type="number" required min="10" max="600" step="1" value="180"></label>
          </div>
          <div class="api-notice">
            <p>密钥仅保留在当前页面，请求直接发送至你填写的 API 地址。服务商需允许浏览器跨域访问（CORS）。</p>
            <p>每次测试收集 3 份有效回答，数字不足时最多尝试 6 次，会消耗接口额度。接口报错即停止，可随时取消。</p>
          </div>
          <div class="form-footer">
            <button id="api-clear-key" class="button secondary" type="button">清除密钥</button>
            <button id="api-stop" class="button secondary" type="button" hidden>停止测试</button>
            <button id="api-start" class="button primary" type="submit" disabled>开始测试</button>
          </div>
        </form>
        <section id="api-test-progress" class="progress-panel" hidden aria-live="polite">
          <div class="progress-heading"><strong id="api-progress-status">准备测试</strong><span id="api-progress-count">有效 0/3 · 已尝试 0/6</span></div>
          <div id="api-progress-bar" class="progress-track" role="progressbar" aria-label="有效回答数" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0"><i id="api-progress-fill"></i></div>
          <div id="api-progress-steps" class="progress-steps"></div>
        </section>
      </section>

      <div id="test-message" class="message working" role="status">正在加载统一指纹库……</div>
      <section id="result" class="result-panel" hidden aria-live="polite"></section>
    </section>
    <footer class="site-footer">基于 <a href="https://github.com/xqy2006/ModelTrace" target="_blank" rel="noopener noreferrer">ModelTrace</a> · 归因在浏览器本地完成</footer>
  </main>

  <script type="module" src="./pages-app.js"></script>
</body>
</html>
